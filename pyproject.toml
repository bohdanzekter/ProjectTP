[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit-zekorfk"
version = "0.1.1"
description = "SIPL Language Toolkit: parser, AST, interpreter, trace, CLI, and visualization"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Твоє Ім'я" }]
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
]

[project.urls]
Homepage = "https://github.com/bohdanzekter/ProjectTP"
Repository = "https://github.com/bohdanzekter/ProjectTP"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
sipl = "sipl.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.setuptools.package-data]
sipl = ["sipl.lark"]